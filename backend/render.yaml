services:
  - type: web
    name: devai-toolkit-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        sync: false  # Set this manually after deploying frontend
      - key: PYTHON_VERSION
        value: "3.11.9"
